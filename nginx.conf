# ─── Worker Processes ────────────────────────────────────────────────────────
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    upstream paper_backend {
        server 127.0.0.1:1001;
        keepalive 64;
    }

    client_max_body_size    50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    proxy_buffer_size   16k;
    proxy_buffers       8 16k;
    proxy_busy_buffers_size 32k;

    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          60s;
    reset_timedout_connection on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml font/woff font/woff2 image/svg+xml;

    limit_req_zone  $binary_remote_addr zone=general:10m rate=50r/s;
    limit_req_zone  $binary_remote_addr zone=api_ai:10m  rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent" ${request_time}s';
    access_log /var/log/nginx/paper.otomasi.app.access.log main;
    error_log  /var/log/nginx/paper.otomasi.app.error.log warn;

    server {
        listen 80;
        listen [::]:80;
        server_name paper.otomasi.app;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name paper.otomasi.app;

        ssl_certificate     /etc/letsencrypt/live/paper.otomasi.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/paper.otomasi.app/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling off;
        ssl_stapling_verify off;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_conn conn_per_ip 20;

        root /home/ubuntu/papergenerator/frontend/dist;
        index index.html;

        location ~* \.(js|css|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            limit_req zone=general burst=100 nodelay;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/api/(generate|generate-full) {
            limit_req zone=api_ai burst=10 nodelay;
            proxy_pass         http://paper_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_send_timeout 60s;
        }

        location ~ ^/api/auth {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass         http://paper_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /api/ {
            limit_req zone=general burst=200 nodelay;
            proxy_pass         http://paper_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }
    }
}
