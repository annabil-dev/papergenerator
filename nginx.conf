# ─── paper.otomasi.app ────────────────────────────────────────────────────────
# HTTP → HTTPS redirect (Certbot will manage the 443 block after: certbot --nginx)
server {
    listen 80;
    listen [::]:80;
    server_name paper.otomasi.app;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS block — Certbot will populate the ssl_ directives automatically.
# If you haven't run certbot yet, comment this whole server block out first.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paper.otomasi.app;

    # TLS certificates (filled in by: sudo certbot --nginx -d paper.otomasi.app)
    ssl_certificate     /etc/letsencrypt/live/paper.otomasi.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paper.otomasi.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Backend API (Flask on :1001) ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:1001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering & extend timeouts for long-running AI calls
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 50M;
    }

    # ── Frontend (Vite preview on :1000) ─────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:1000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
